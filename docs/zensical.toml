[project.theme]
variant = "modern"
custom_dir = "overrides"
language = "en"
logo = "assets/logo/logo.svg"
favicon = "assets/logo/favicon.svg"
features = [
  "navigation.tracking",
  "navigation.indexes",
  "navigation.tabs",
  "navigation.instant",
  "navigation.top",
  "navigation.sections",
  "content.code.copy",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions]
meta = {}
admonition = {}
def_list = {}
md_in_html = {}
attr_list = {}
tables = {}
footnotes = {}
toc.permalink = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.progressbar = {}
pymdownx.magiclink = { repo_url_shorthand = true, user = "polakowo", repo = "vectorbt" }
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight.extend_pygments_lang = [
  { name = "pycon3", lang = "pycon", options = { python3 = true } },
]
pymdownx.tasklist.custom_checkbox = true

[project.extra]
sponsor = "https://github.com/sponsors/polakowo"
social = [
  { icon = "fontawesome/brands/github", link = "https://github.com/polakowo" },
]

[project.extra.analytics]
provider = "google"
property = "G-4QLCS0J048"

[project.plugins.search]

[project.plugins.minify]
minify_html = true

[project.validation]
absolute_links = "ignore"
